<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Excalicord+ 在线录制能力总览</title>
  <desc id="desc">白板、当前幻灯片、整个屏幕或指定窗口，配合摄像头画中画；所有录制内容保存到用户本地文件夹。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171a3a"/>
      <stop offset="1" stop-color="#42286e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c6a7ff"/>
      <stop offset="1" stop-color="#7f6cff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1088" cy="78" r="210" fill="#9676ff" opacity=".12"/>
  <circle cx="68" cy="624" r="250" fill="#4ce0d2" opacity=".08"/>
  <text x="76" y="98" fill="#ffffff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="700">Excalicord+</text>
  <text x="76" y="138" fill="#d6d3f4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23">在线白板 · 幻灯片 · 屏幕录制</text>
  <rect x="76" y="166" width="313" height="42" rx="21" fill="#ffffff" opacity=".12"/>
  <text x="98" y="194" fill="#ffffff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">excalicord.learnbox.cc</text>

  <g filter="url(#shadow)">
    <rect x="76" y="250" width="244" height="150" rx="20" fill="#ffffff" opacity=".96"/>
    <rect x="342" y="250" width="244" height="150" rx="20" fill="#ffffff" opacity=".96"/>
    <rect x="608" y="250" width="244" height="150" rx="20" fill="#ffffff" opacity=".96"/>
    <rect x="874" y="250" width="244" height="150" rx="20" fill="#ffffff" opacity=".96"/>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="102" y="301" fill="#7f6cff" font-size="20" font-weight="700">01</text>
    <text x="102" y="340" fill="#20203b" font-size="27" font-weight="700">白板全景</text>
    <text x="102" y="374" fill="#62627b" font-size="18">课程与方案讲解</text>
    <text x="368" y="301" fill="#7f6cff" font-size="20" font-weight="700">02</text>
    <text x="368" y="340" fill="#20203b" font-size="27" font-weight="700">当前幻灯片</text>
    <text x="368" y="374" fill="#62627b" font-size="18">逐页表达更聚焦</text>
    <text x="634" y="301" fill="#7f6cff" font-size="20" font-weight="700">03</text>
    <text x="634" y="340" fill="#20203b" font-size="27" font-weight="700">整屏 / 窗口</text>
    <text x="634" y="374" fill="#62627b" font-size="18">软件演示更干净</text>
    <text x="900" y="301" fill="#7f6cff" font-size="20" font-weight="700">04</text>
    <text x="900" y="340" fill="#20203b" font-size="27" font-weight="700">摄像头画中画</text>
    <text x="900" y="374" fill="#62627b" font-size="18">保留讲解者的表达</text>
  </g>

  <path d="M190 472h818" stroke="#d8d1ff" stroke-width="2" stroke-dasharray="8 10" opacity=".8"/>
  <circle cx="190" cy="472" r="12" fill="#4ce0d2"/>
  <circle cx="600" cy="472" r="12" fill="#a98bff"/>
  <circle cx="1008" cy="472" r="12" fill="#ffca7a"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="190" y="522" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">选择本地文件夹</text>
    <text x="600" y="522" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">浏览器原生录制与合成</text>
    <text x="1008" y="522" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">视频留在你的设备</text>
    <text x="600" y="572" text-anchor="middle" fill="#d6d3f4" font-size="18">不需要 Docker，不上传录制内容</text>
  </g>
</svg>
